spring.application.name=biblioteca-api

# Porta: o Render define PORT; localmente usa 8080
server.port=${PORT:8080}
# Atrás do proxy do Render: respeita X-Forwarded-* (IP real do cliente, https nos links HATEOAS)
server.forward-headers-strategy=native

spring.datasource.url=jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# /swagger-ui.html é a página personalizada (static/swagger-ui.html, tema vinho + cinza escuro).
# A interface padrão do Springdoc continua disponível neste outro caminho:
springdoc.swagger-ui.path=/swagger-ui-padrao.html
springdoc.api-docs.path=/v3/api-docs
springdoc.remove-broken-reference-definitions=false
# Gera cada documento (v1/v2) a cada requisição, evitando que um herde dados do outro em cache
springdoc.cache.disabled=true

# ---- CORS: origens e métodos permitidos (separados por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# ---- Rate limiting (por IP): máximo de requisições por janela de tempo
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:30}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# ---- Idempotência: por quanto tempo uma chave X-Idempotency-Key é lembrada
app.idempotency.ttl-hours=24

# ---- Chaves de API de TESTE criadas na inicialização (troque/remova fora do ambiente acadêmico)
app.security.seed-keys.admin=${ADMIN_API_KEY:admin-key-123456}
app.security.seed-keys.escrita=${ESCRITA_API_KEY:escrita-key-123456}
app.security.seed-keys.leitura=${LEITURA_API_KEY:leitura-key-123456}

# ---- Versionamento: false desativa o modo v1 (sem chave de API/rate limit/idempotência/CORS) neste ambiente
app.versionamento.v1-habilitada=${V1_HABILITADA:true}
app.versionamento.dados-separados=${DADOS_SEPARADOS_POR_VERSAO:true}
