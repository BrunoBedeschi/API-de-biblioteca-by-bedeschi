services:
  - type: web
    name: biblioteca-api
    runtime: docker
    plan: free
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      # Chaves de API (se omitidas, valem as chaves de teste do README).
      # Para trocar, defina-as no painel do Render e atualize a descrição da API se necessário:
      # ADMIN_API_KEY / ESCRITA_API_KEY / LEITURA_API_KEY
      # Origens CORS extras (separadas por vírgula), por exemplo o site do seu front-end:
      # CORS_ALLOWED_ORIGINS
      # V1_HABILITADA=false desativa o modo v1 (sem chave de API) em produção
